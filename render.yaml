services:
  - type: web
    name: quotex-elite-engine
    env: python
    region: frankfurt # or oregon / ohio
    plan: free
    buildCommand: "pip install --upgrade pip && pip install -r requirements.txt"
    startCommand: "python main.py"
    healthCheckPath: "/health"
    autoDeploy: true
    envVars:
      - key: PORT
        value: 10000
      - key: PYTHON_VERSION
        value: 3.10.12
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_CHAT_ID
        sync: false
      - key: MIN_CONFIDENCE
        value: "85"
      - key: AUTO_SCAN_INTERVAL
        value: "10"
      - key: QUOTEX_SESSION_SSID
        sync: false
